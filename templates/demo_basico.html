<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo - Guardianes de la atención</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <style>
        body {
            background: white;
            min-height: 100vh;
            padding: 20px;
            font-family: "Gill Sans Extrabold", Helvetica, sans-serif;
        }

        .container-demo {
            background: white;
            border-radius: 10px;
            padding: 40px;
            border: 2px solid black;
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            color: black;
            text-align: center;
            margin-bottom: 30px;
            font-size: 45px;
        }

        h2 {
            color: black;
            font-size: 24px;
            margin-top: 0;
            border-bottom: 2px solid black;
            padding-bottom: 10px;
        }

        .demo-section {
            margin-bottom: 40px;
            padding: 20px;
            background: #f8f9fa;
            border-left: 5px solid black;
            border-radius: 5px;
        }

        .demo-game-area {
            background: white;
            border: 2px solid black;
            border-radius: 8px;
            height: 350px;
            position: relative;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .demo-falling-object {
            width: 60px;
            height: 60px;
            position: absolute;
            background: no-repeat center/contain;
        }

        .demo-player {
            position: absolute;
            bottom: 10px;
            width: 80px;
            height: 80px;
            background: url('/static/images/transports/children.png') no-repeat center/contain;
            cursor: move;
            border: 2px solid red;
            border-radius: 5px;
        }

        .demo-info {
            text-align: center;
            font-size: 18px;
            margin: 15px 0;
            font-weight: bold;
        }

        .instruction-box {
            background: #e8f4f8;
            border: 2px solid black;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            font-size: 16px;
            text-align: center;
            color: #333;
        }

        .btn-demo {
            background: white;
            color: black;
            padding: 12px 30px;
            font-size: 16px;
            border: 2px solid black;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
            transition: background 0.3s;
        }

        .btn-demo:hover {
            background: #f0f0f0;
            color: black;
            text-decoration: none;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .feature-card {
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
        }

        .feature-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .feature-card h3 {
            color: black;
            font-size: 18px;
            margin-top: 0;
        }

        .feature-card img {
            width: 80px;
            height: 80px;
            margin: 10px 0;
            object-fit: contain;
        }

        .points-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin: 10px 5px;
        }

        .points-positive {
            background: #d4edda;
            color: #155724;
        }

        .points-negative {
            background: #f8d7da;
            color: #721c24;
        }

        .button-group {
            text-align: center;
            margin-top: 30px;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #667eea;
            font-size: 16px;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container-demo">
        <h1>🎮 Guardianes de la atención</h1>
        
        <!-- Demostración Interactiva -->
        <div class="demo-section">
            <p style="text-align: center; font-size: 16px; color: #666; margin-bottom: 15px;">Arrastra los niños para atrapar los medios de transporte y evita las bombas</p>
            
            <div class="instruction-box" id="instructionBox">
                Haz clic en el botón "Comenzar Demo" para empezar
            </div>

            <div class="demo-game-area" id="demoGameArea">
                <!-- El demo aquí -->
            </div>

            <div class="demo-info">
                <p>Puntuación: <strong id="demoScore">0</strong> | Tiempo: <strong id="demoTimer">30</strong>s</p>
            </div>

            <div class="button-group">
                <button class="btn-demo" id="startDemoBtn">▶️ Comenzar Demo</button>
                <button class="btn-demo" id="resetDemoBtn" style="display:none;">🔄 Reintentar</button>
                <button class="btn-demo" onclick="location.href='/game_menu'">⬅️ Volver al Menú</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='demo_game2.js') }}"></script>
</body>
</html>
