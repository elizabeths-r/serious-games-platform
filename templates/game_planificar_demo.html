<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo - Juego de Categorización</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .demo-container {
            background-color: white;
            border-radius: 15px;
            padding: 40px;
            border: 3px solid black;
            max-width: 900px;
            text-align: center;
            width: 100%;
        }

        h1 {
            color: black;
            text-align: center;
            margin-bottom: 30px;
            font-size: 45px;
        }

        .demo-section {
            margin-bottom: 40px;
            padding: 20px;
            background: #f8f9fa;
            border-left: 5px solid black;
            border-radius: 5px;
        }

        #score-info {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .game-area {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* Opciones (items a categorizar) */
        #options {
            display: grid;
            grid-template-columns: repeat(2, 100px);
            justify-content: center;
            column-gap: 60px;
            row-gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f0f0f0;
            border-radius: 10px;
        }

        #options img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            border: 2px solid #ccc;
            border-radius: 10px;
            cursor: grab;
            background: #fff;
            padding: 5px;
            transition: transform 0.2s;
        }

        #options img:active {
            transform: scale(0.9);
        }

        /* Slots (categorías) */
        #slots {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .drop-slot {
            width: 120px;
            height: 120px;
            border: 3px dashed #aaa;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #555;
            background: #f0f0f0;
            box-sizing: border-box;
            font-size: 16px;
            cursor: pointer;
            gap: 3px;
        }

        .drop-slot .emoji {
            font-size: 24px;
            line-height: 1;
        }

        .drop-slot img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            width: auto;
            height: auto;
            margin: 3px;
        }

        .btn-demo {
            background: white;
            color: black;
            padding: 12px 30px;
            font-size: 16px;
            border: 2px solid black;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
            transition: background 0.3s;
            font-weight: bold;
        }

        .btn-demo:hover {
            background: #f0f0f0;
            color: black;
            text-decoration: none;
        }

        .btn-demo.highlight {
            animation: pulse-button 1.5s infinite;
        }

        #message {
            font-size: 24px;
            color: black;
            margin-top: 20px;
            min-height: 30px;
            font-weight: bold;
        }

        .info-text {
            color: #666;
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .button-group {
            text-align: center;
            margin-top: 30px;
        }

        @keyframes pulse-button {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7);
            }
            50% {
                transform: scale(1.1);
                box-shadow: 0 0 0 15px rgba(76, 175, 80, 0);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(76, 175, 80, 0);
            }
        }

        .btn-demo.highlight {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <h1>🎮 Demo - Juego de Categorización</h1>
        
        <div class="demo-section">
            <div class="info-text">
                <p>💡 Arrastra las imágenes a su categoría correcta</p>
            </div>

            <div class="game-area">
                <div id="score-info">
                    Puntuación: <span id="score">0</span> / 2
                </div>

                <!-- Items a categorizar -->
                <div id="options">
                    <img src="/static/images/fruits/apple.png" data-item="fruta1" data-slot="frutas" draggable="true" alt="apple">
                    <img src="/static/images/vegetables/tomato.png" data-item="verdura1" data-slot="verduras" draggable="true" alt="tomato">
                </div>

                <!-- Categorías -->
                <div id="slots">
                    <div class="drop-slot" id="frutas_slot" data-slot="frutas">
                        <span class="emoji">🍍</span>Fruta
                    </div>
                    <div class="drop-slot" id="verduras_slot" data-slot="verduras">
                        <span class="emoji">🥗</span>Verdura
                    </div>
                </div>

                <p id="message"></p>
            </div>

            <div class="button-group">
                <button class="btn-demo highlight" id="startButton">▶️ Comenzar Demo</button>
                <button class="btn-demo" onclick="location.href='/game_menu'">⬅️ Volver al Menú</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='game_planificar_demo.js') }}"></script>
</body>
</html>
