<!DOCTYPE html>
<html lang="es">
<head>
    <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
        <style>
            body 
            {
                width: 800px;
                margin: 0 auto;
                background-color: white;
                padding: 0 20px 20px 20px;
                border: 3px solid black;
                font-family: "Gill Sans Extrabold", Helvetica, sans-serif;
            }
    
            h1 {
                font-size: 50px;
            }
    
            p {
                text-align: center;
            }
    
            .button {
                background: transparent;
                border: 1px solid transparent;
                box-sizing: border-box;
                cursor: pointer;
                font-size: 20px;
                font-weight: 700;
                line-height: 1;
                margin: 10px;
                padding: 2px 10px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
                outline: none;
                position: relative;
                top: 0;
                text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);
                transition: all 0.2s ease-in-out 0s;
            }
    
            .grey {
                background: #4c4c4c;
                color: #fff;
                box-shadow: 0 2px 0 #333333;
            }
    
            .grey:hover {
                background: #747373;
            }
    
            .grey:active, .grey:focus {
                background: #444444;
            }
        </style>
</head>
<body>
    <div class="game-container">
        <h1>Memoria magica</h1>
    <div id="info">
        <p>Puntuacion: <span id="score">0</span></p>
    </div>
        <div class="grid" id="grid">
            <p>
            <form action="/game_memoriamagic" method="POST">
                <input type="hidden" name="action" value="button_pressed">
                <input type="hidden" name="level" value="{{ level }}">
                <button type="submit" class="btn btn-default btn-lg" style="width: 350px;">Como Jugar?</button>
            </form>
            </p>
            <!-- Las cartas se generarÃ¡n aquÃ­ -->
        </div>
        <p></p>

<!-- Modal para mostrar puntaje final -->
<div id="scoreModal" class="modal fade" role="dialog">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title">Juego terminado</h4>
      </div>
      <div class="modal-body">
        <p>Felicidades, Tu puntuacion final: <span id="scoreDisplay"></span></p>
      </div>
      <div class="modal-footer">
        <button type="button" id="goToResults" class="btn btn-default" data-dismiss="modal">Ok</button>
      </div>
    </div>
  </div>
</div>
        <button style="width: 350px;" class="btn btn-default btn-lg" id="startButton">Iniciar Juego</button>
        <a style="width: 350px;" href="/game_menu" class="btn btn-default btn-lg">Volver</a>
        <p id="message"></p>
    </div>
    <script src="{{ url_for('static', filename='game_3.js') }}"></script>
</body>
</html>
