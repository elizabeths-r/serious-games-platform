<!DOCTYPE html>
<html lang="es"> 
    <!DOCTYPE html>
    <html>
    <head>
        <title>{{ title }}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
        <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
        <script>
            const level = "{{ level }}";
        </script>
        <script src="../../static/game_Chile.js" defer></script>
        <style>
            body 
            {
                width: 800px;
                margin: 0 auto;
                background-color: white;
                padding: 0 20px 20px 20px;
                border: 3px solid black;
                font-family: "Gill Sans Extrabold", Helvetica, sans-serif;
            }
    
            h1 {
                font-size: 50px;
            }
    
            p {
                text-align: center;
            }
    
            .button {
                background: transparent;
                border: 1px solid transparent;
                box-sizing: border-box;
                cursor: pointer;
                font-size: 20px;
                font-weight: 700;
                line-height: 1;
                margin: 10px;
                padding: 2px 10px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
                outline: none;
                position: relative;
                top: 0;
                text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);
                transition: all 0.2s ease-in-out 0s;
            }
    
            .grey {
                background: #4c4c4c;
                color: #fff;
                box-shadow: 0 2px 0 #333333;
            }
    
            .grey:hover {
                background: #747373;
            }
    
            .grey:active, .grey:focus {
                background: #444444;
            }

            /* Animaciones para estímulos correctos e incorrectos */
            .stimulus.correct {
                animation: pulse 0.6s ease-in-out;
            }

            @keyframes pulse {
                0%, 100% { transform: scale(1); opacity: 1; }
                50% { transform: scale(1.2); opacity: 0.8; }
            }

            .stimulus.incorrect {
                animation: shake 0.6s;
            }

            @keyframes shake {
                0%, 100% { transform: translateX(0) rotate(0deg); }
                10% { transform: translateX(-8px) rotate(-2deg); }
                20% { transform: translateX(8px) rotate(2deg); }
                30% { transform: translateX(-8px) rotate(-2deg); }
                40% { transform: translateX(8px) rotate(2deg); }
                50% { transform: translateX(-8px) rotate(-2deg); }
                60% { transform: translateX(8px) rotate(2deg); }
                70% { transform: translateX(-8px) rotate(-2deg); }
                80% { transform: translateX(8px) rotate(2deg); }
                90% { transform: translateX(-8px) rotate(-2deg); }
            }
        </style>
    </head>
<body>
    <h1>Atenção ativa</h1>
    <div id="game-area">
        <!-- Aquí aparecerán los estímulos -->
    </div>
    <div id="info">
        <p>Tempo: <span id="time">120</span> segundos</p>
        <p>Pontuação: <span id="score">0</span></p>
    </div>
     <!-- Modal de resultados mejorado -->
     <div id="timeUpModal" class="modal fade" role="dialog">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <button type="button" class="close" data-dismiss="modal">&times;</button>
              <h4 class="modal-title">Resultados del Juego</h4>
            </div>
            <div class="modal-body">
              <h5>Datos del Jugador:</h5>
              <p><strong>Nombre:</strong> <span id="playerName">-</span></p>
              <p><strong>Nivel:</strong> <span id="playerLevel">-</span></p>
              
              <hr>
              
              <h5 style="text-align: center; font-size: 24px; margin: 30px 0;">Puntuación Total:</h5>
              <p style="text-align: center; font-size: 48px; font-weight: bold; color: #007bff;"><span id="totalScoreDisplay">0</span></p>
              
              <hr>
              
              <h5 style="display: none;">Métricas Detalladas:</h5>
              <div style="display: none;">
                <p><strong>Aciertos:</strong> <span id="hitsDisplay">0</span></p>
                <p><strong>Errores:</strong> <span id="errorsDisplay">0</span></p>
                <p><strong>Duración del Juego:</strong> <span id="gameDurationDisplay">0</span>s</p>
                <p><strong>Velocidad promedio de respuesta:</strong> <span id="avgResponseTimeDisplay">0</span>ms</p>
              </div>
              
              <div style="display: none;">
                <h5>Detalle de Respuestas:</h5>
                <div style="max-height: 300px; overflow-y: auto;">
                  <table class="table table-sm table-striped" id="responsesTable">
                    <thead>
                      <tr>
                        <th>#</th>
                        <th>Estímulo</th>
                        <th>Respuesta</th>
                        <th>Tiempo (ms)</th>
                      </tr>
                    </thead>
                    <tbody id="responsesBody">
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-default" id="goToResults">Aceptar</button>
            </div>
          </div>
        </div>
      </div>
    <p>
    <button class="btn btn-default btn-lg" id="pauseButton">Pausar</button>
    <button class="btn btn-default btn-lg" id="resumeButton" style="display:none;">Seguir</button>
    </p>
    <button class="btn btn-default btn-lg" id="startButton">Iniciar jogo</button>
    <button class="btn btn-default btn-lg" onclick="location.href='/game_menu'">Menu</button>
</body>
</html>
