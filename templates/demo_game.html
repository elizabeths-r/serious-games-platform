<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atencion Activa</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <style>
        body {
            background: white;
            min-height: 100vh;
            padding: 20px;
            font-family: "Gill Sans Extrabold", Helvetica, sans-serif;
        }

        .container-demo {
            background: white;
            border-radius: 15px;
            padding: 40px;
            border: 2px solid black;
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            color: black;
            text-align: center;
            margin-bottom: 30px;
            font-size: 45px;
        }

        .demo-section {
            margin-bottom: 40px;
            padding: 20px;
            background: #f8f9fa;
            border-left: 5px solid black;
            border-radius: 5px;
        }

        .demo-section h2 {
            color: #764ba2;
            font-size: 24px;
            margin-top: 0;
        }

        .demo-game-area {
            background: white;
            border: 2px solid black;
            border-radius: 8px;
            height: 350px;
            position: relative;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .demo-stimulus {
            width: 90px;
            height: 90px;
            cursor: pointer;
            transition: transform 0.2s ease;
            position: absolute;
        }

        .demo-stimulus:hover {
            transform: scale(1.1);
        }

        .demo-stimulus.correct {
            animation: pulse 0.5s;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .demo-stimulus.wrong {
            animation: shake 0.3s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .demo-info {
            text-align: center;
            font-size: 18px;
            margin: 15px 0;
            font-weight: bold;
        }

        .instruction-box {
            background: #e8f4f8;
            border: 2px solid black;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            font-size: 16px;
            text-align: center;
            color: #333;
        }

        .btn-demo {
            background: white;
            color: black;
            padding: 12px 30px;
            font-size: 16px;
            border: 2px solid black;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
            transition: background 0.3s;
        }

        .btn-demo:hover {
            background: #f0f0f0;
            color: black;
            text-decoration: none;
        }

        .btn-demo.highlight {
            animation: highlight-pulse 4s ease-in-out;
        }

        @keyframes highlight-pulse {
            0%, 100% { background: white; box-shadow: none; }
            50% { background: #4CAF50; color: white; box-shadow: 0 0 15px rgba(76, 175, 80, 0.8); }
        }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .level-card {
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }

        .level-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            transform: translateY(-5px);
        }

        .level-card h3 {
            color: #667eea;
            font-size: 22px;
            margin-top: 0;
        }

        .level-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin: 10px 5px;
        }

        .feature-list {
            list-style: none;
            padding: 0;
        }

        .feature-list li {
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        .feature-list li:before {
            content: "✓ ";
            color: #667eea;
            font-weight: bold;
            margin-right: 10px;
        }

        .feature-list li:last-child {
            border-bottom: none;
        }

        .button-group {
            text-align: center;
            margin-top: 30px;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #667eea;
            font-size: 16px;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container-demo">
        <h1>🎮 Atención Activa</h1>

        <!-- Demostración Interactiva -->
        <div class="demo-section">
            <p style="text-align: center; font-size: 16px; color: #666;">Escucha la instrucción y haz clic en la imagen correcta</p>
            
            <div class="instruction-box" id="instructionBox">
                Haz clic en el botón "Comenzar Demo" para empezar
            </div>

            <div class="demo-game-area" id="demoGameArea">
                <!-- Los estímulos se generarán aquí -->
            </div>

            <div class="demo-info">
                <p>Aciertos: <strong id="demoScore">0</strong> / 3</p>
            </div>

            <div class="button-group">
                <button class="btn-demo" id="startDemoBtn">▶️ Comenzar Demo</button>
                <button class="btn-demo" id="resetDemoBtn" style="display:none;">Reintentar</button>
                <button class="btn-demo" onclick="location.href='/game_menu'">⬅️ Volver al Menú</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='demo_game.js') }}"></script>
</body>
</html>
